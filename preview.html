<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adore-A-Boo · Meta Ads Weekly Performance</title>
<style>
:root{
  --bg:#0a0c11; --bg2:#0e1118; --card:#121621; --card2:#171c29; --line:#222a3a;
  --text:#eaedf5; --muted:#8e97ac; --faint:#5d667b;
  --brand:#ff8fab; --brand2:#ffb4c6;
  --good:#4ade9a; --bad:#ff6b7a; --warn:#ffd166; --neutral:#9aa4bd;
  --c1:#7c9cff; --c2:#ff8fab; --c3:#ffd166; --c4:#5eead4;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:Inter,"SF Pro Text","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--text);line-height:1.5;
  background:radial-gradient(1200px 520px at 85% -10%,rgba(255,143,171,.10),transparent 60%),radial-gradient(900px 480px at -10% 5%,rgba(124,156,255,.08),transparent 55%),var(--bg);
  -webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 56px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#ffb36b);display:grid;place-items:center;color:#2a0f18;font-weight:800;font-size:15px;letter-spacing:.5px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand2);font-weight:700}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.period{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.pill b{color:var(--text);font-weight:600}
.pill.cur{border-color:rgba(255,143,171,.45)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.by{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.mlogo{height:36px;width:auto;display:block}
@media (max-width:700px){.right{align-items:flex-start;width:100%}}
section{margin-top:30px}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.signal{padding:22px;border-color:rgba(255,143,171,.28);background:linear-gradient(135deg,rgba(255,143,171,.09),rgba(18,22,33,1) 55%)}
.signal .head{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px}
.signal p{color:#c4cada;font-size:15px;max-width:900px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g6{grid-template-columns:repeat(4,1fr)}
@media (max-width:980px){.g4,.g6{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media (max-width:560px){.g4,.g2{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,1fr)}.pulse .cell{padding:12px}.pulse .v{font-size:17px}.pulse .prev{display:block;margin:0}.wrap{padding:20px 14px 40px}h1{font-size:19px}}
.kpi .label{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .val{font-size:30px;font-weight:750;letter-spacing:-.02em;margin:6px 0 8px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.chip.good{color:var(--good);background:rgba(74,222,154,.12)}
.chip.bad{color:var(--bad);background:rgba(255,107,122,.12)}
.chip.neutral{color:var(--neutral);background:rgba(154,164,189,.13)}
.pair{margin-top:12px;display:grid;gap:6px}
.bar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.bar .t{width:34px;flex:none}
.bar .track{flex:1;height:7px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px}
.bar .n{width:64px;text-align:right;font-variant-numeric:tabular-nums;color:#c4cada;flex:none}
.take .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:rgba(255,143,171,.14);color:var(--brand2);font-weight:800;font-size:13px;margin-bottom:10px}
.take h3,.act h3{font-size:15.5px;font-weight:700;margin-bottom:6px;letter-spacing:-.005em}
.take p,.act p{font-size:13.8px;color:#b4bccd}
.pulse .cell{padding:14px 16px}
.pulse .label{font-size:12px;color:var(--muted);font-weight:600}
.pulse .v{font-size:21px;font-weight:700;margin:3px 0 5px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pulse .prev{font-size:11.5px;color:var(--faint);margin-left:6px;font-weight:500}
.funnel{display:grid;gap:12px}
.frow{display:grid;grid-template-columns:150px 1fr 190px;gap:14px;align-items:center}
.frow .name{font-size:13.5px;font-weight:600}
.frow .name small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.fbars{display:grid;gap:5px}
.fbar{height:12px;border-radius:99px;background:rgba(255,255,255,.05);position:relative;overflow:hidden}
.fbar i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.frow .rate{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;color:#c4cada}
.frow .rate>span{display:block;color:var(--muted);font-size:11.5px}
@media (max-width:700px){.frow{grid-template-columns:1fr;gap:6px}.frow .rate{text-align:left}}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:14px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.health .big{font-size:28px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.health .label{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.health .sub{font-size:12px;color:var(--faint);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:0 10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:13px 10px;border-bottom:1px solid rgba(34,42,58,.7);text-align:right;vertical-align:middle}
tr:last-child td{border-bottom:0}
td .cn{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;text-align:left}
td .dot{width:9px;height:9px;border-radius:3px;flex:none}
td .sub{display:block;color:var(--faint);font-size:11.5px;font-weight:500}
.status{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.status.strong{color:var(--good);background:rgba(74,222,154,.12)}
.status.stable{color:var(--neutral);background:rgba(154,164,189,.13)}
.status.low{color:var(--bad);background:rgba(255,107,122,.13)}
.status.fatigue{color:var(--warn);background:rgba(255,209,102,.13)}
.scroll{overflow-x:auto}
.roasrow{display:grid;grid-template-columns:200px 1fr 70px;gap:14px;align-items:center;margin:11px 0}
.roasrow .nm{font-size:13px;font-weight:600}
.rtrack{position:relative;height:22px}
.rtrack .b1,.rtrack .b2{position:absolute;left:0;height:9px;border-radius:99px}
.rtrack .b1{top:0}.rtrack .b2{top:12px;opacity:.38}
.rline{position:absolute;top:-6px;bottom:-6px;width:0;border-left:1.5px dashed rgba(255,255,255,.35)}
.rline em{position:absolute;top:-15px;left:-7px;font-style:normal;font-size:10.5px;color:var(--muted)}
.rv{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
@media (max-width:700px){.roasrow{grid-template-columns:1fr 60px}.roasrow .rtrack{grid-column:1/-1;order:3}}
.stack{display:flex;height:30px;border-radius:10px;overflow:hidden;gap:2px;margin:8px 0}
.stack div{display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#10131b;min-width:0;overflow:hidden;white-space:nowrap}
.stacklabel{font-size:12px;color:var(--muted);font-weight:600}
.act .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:rgba(124,156,255,.16);color:#a9bcff;font-weight:800;font-size:13px;margin-bottom:10px}
footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
@media print{body{background:#0a0c11;-webkit-print-color-adjust:exact;print-color-adjust:exact}.wrap{padding:10px}section{break-inside:avoid}}
</style>
</head>

(function(){

const derive = x => ({
  spend:x.spend, impressions:x.impressions, reach:x.reach, clicks:x.clicks, lpv:x.lpv, atc:x.atc, ic:x.ic, purchases:x.purchases, value:x.value,
  roas:x.value/x.spend, cpa:x.purchases? x.spend/x.purchases : null, ctr:x.clicks/x.impressions*100, cpc:x.spend/x.clicks, cpm:x.spend/x.impressions*1000,
  freq:x.impressions/x.reach, lpvRate:x.lpv/x.clicks*100, atcRate:x.atc/x.lpv*100, icRate:x.ic/x.atc*100, purRate:x.purchases/x.ic*100
});

function chip(cur, prev, better, kind){
  if(kind==='pp'){ const d = cur-prev; const cls = Math.abs(d)<0.05?'neutral':((d>0)===(better==='up')?'good':'bad'); return `<span class="chip ${cls}">${d>=0?'+':'−'}${Math.abs(d).toFixed(1)} pp</span>`; }

  let cls='neutral'; if(better!=='flat' && Math.abs(ch)>=0.005) cls = ((ch>0)===(better==='up'))?'good':'bad';
  return `<span class="chip ${cls}">${ch>=0?'▲':'▼'} ${Math.abs(ch*100).toFixed(1)}%</span>`;
}
function pairBars(cur, prev, fmt, color){
  const m = Math.max(cur,prev)||1;
  return `<div class="pair"><div class="bar"><span class="t">This</span><div class="track"><div class="fill" style="width:${cur/m*100}%;background:${color}"></div></div><span class="n">${fmt(cur)}</span></div>

 ['CPC (link)',inr2(c.cpc),inr2(p.cpc),chip(c.cpc,p.cpc,'down')],
 ['CPM',inr(c.cpm),inr(p.cpm),chip(c.cpm,p.cpm,'down')],
 ['Frequency',f2(c.freq),f2(p.freq),chip(c.freq,p.freq,'flat')],
 ['Cost per purchase',inr(c.cpa),inr(p.cpa),chip(c.cpa,p.cpa,'down')]];

<div class="card"><div class="label">Cost per purchase</div><div class="big">${inr(c.cpa)}</div><div class="sub">Previous week ${inr(p.cpa)}</div></div>

h += `<section><h2>Campaign view</h2><div class="card scroll"><table><thead><tr><th>Campaign</th><th>Spend</th><th>Purchases</th><th>CPA</th><th>ROAS</th><th>Frequency</th><th>Status</th></tr></thead><tbody>${camps.map(k=>{const s=status(k);return `<tr>
<td><div class="cn"><span class="dot" style="background:${k.color}"></span><span>${k.name}<span class="sub">${(k.cur.spend/sc*100).toFixed(0)}% of spend · prev ${(k.prv.spend/sp*100).toFixed(0)}%</span></span></div></td>
<td>${inr(k.cur.spend)}<span class="sub">prev ${inr(k.prv.spend)}</span></td><td>${num(k.cur.purchases)}<span class="sub">prev ${num(k.prv.purchases)}</span></td>

<div class="grid g2" style="margin-top:14px">
<div class="card"><h2 style="margin-bottom:6px">ROAS by campaign</h2>${(function(){const mx=Math.max(2.2,...camps.map(k=>Math.max(k.roas,k.roasP)))*1.05;return camps.map((k,i)=>`<div class="roasrow"><div class="nm">${k.name}</div><div class="rtrack"><div class="b1" style="width:${k.roas/mx*100}%;background:${k.roas<1?'var(--bad)':k.color}"></div><div class="b2" style="width:${k.roasP/mx*100}%;background:${k.color}"></div><div class="rline" style="left:${1/mx*100}%">${i===0?'<em>1×</em>':''}</div></div><div class="rv">${f2(k.roas)}×<span style="display:block;color:var(--faint);font-weight:500">${f2(k.roasP)}×</span></div></div>`).join('')})()}<div class="legend"><span>Solid bar: this week</span><span>Faint bar: previous week</span></div></div>
